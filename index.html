<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>noVNC</title>
    <style>
        :root {
            --bg: #f4f4f5;
            --card-bg: #ffffff;
            --card-border: #d4d4d8;
            --card-shadow: rgba(0, 0, 0, 0.08);
            --text: #18181b;
            --text-muted: #71717a;
            --input-bg: #ffffff;
            --input-border: #d4d4d8;
            --input-focus: #3b82f6;
            --btn-bg: #3b82f6;
            --btn-hover: #2563eb;
            --btn-text: #ffffff;
            --divider: #e4e4e7;
            --label: #3f3f46;
            --check-bg: #3b82f6;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #18181b;
                --card-bg: #27272a;
                --card-border: #3f3f46;
                --card-shadow: rgba(0, 0, 0, 0.3);
                --text: #fafafa;
                --text-muted: #a1a1aa;
                --input-bg: #3f3f46;
                --input-border: #52525b;
                --input-focus: #60a5fa;
                --btn-bg: #3b82f6;
                --btn-hover: #60a5fa;
                --btn-text: #ffffff;
                --divider: #3f3f46;
                --label: #d4d4d8;
                --check-bg: #3b82f6;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }

        .wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
        }

        .connect {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 4px 12px var(--card-shadow);
        }

        h3 {
            font-size: 1.25rem;
            font-weight: 600;
            padding-bottom: 12px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--divider);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-row {
            display: flex;
            gap: 12px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--label);
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="number"],
        input[type="password"] {
            width: 100%;
            padding: 8px 12px;
            font-size: 0.9375rem;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text);
            outline: none;
            transition: border-color 0.15s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="password"]:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--check-bg);
            cursor: pointer;
        }

        .checkbox-item label {
            margin-bottom: 0;
            font-size: 0.8125rem;
            cursor: pointer;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 500;
            color: var(--btn-text);
            background: var(--btn-bg);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.15s;
        }

        .btn:hover {
            background: var(--btn-hover);
        }

        @media only screen and (max-width: 480px) {
            .connect {
                border: none;
                border-radius: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }

            .wrapper {
                padding: 0;
            }
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="connect">
            <h3>noVNC</h3>
            <form action="/vnc.html" method="GET">
                {{if .arbitraryHosts}}
                {{if .arbitraryPorts}}
                <div class="form-row">
                    <div class="form-group">
                        <label for="host">Host</label>
                        <input type="text" id="host" placeholder="{{.host}}" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="port">Port</label>
                        <input type="number" id="port" min="1" max="65535" placeholder="{{.port}}" autocomplete="off">
                    </div>
                </div>
                {{else}}
                <div class="form-group">
                    <label for="host">Host</label>
                    <input type="text" id="host" placeholder="{{.host}}" autocomplete="off">
                </div>
                {{end}}
                {{end}}

                {{if not .noURLPassword}}
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" placeholder="Password" autofocus>
                </div>
                {{end}}

                <input type="hidden" name="path" id="path" value="vnc">
                <input type="hidden" name="autoconnect" id="autoconnect" value="true">

                {{range $key, $value := .params}}
                <input type="hidden" name="{{$key}}" id="{{$key}}" value="{{$value}}">
                {{end}}

                {{if not .basicUI}}
                <h3>Connection Options</h3>

                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" name="reconnect" id="reconnect" value="true" checked>
                        <label for="reconnect">Auto-reconnect</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" name="show_dot" id="show_dot" value="true" checked>
                        <label for="show_dot">Show dot cursor</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" name="bell" id="bell" value="on">
                        <label for="bell">Enable bell</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" name="view_only" id="view_only" value="true" {{if .defaultViewOnly}}checked{{end}}>
                        <label for="view_only">View only</label>
                    </div>
                </div>
                {{else}}
                <input type="hidden" name="reconnect" id="reconnect" value="true">
                <input type="hidden" name="show_dot" id="show_dot" value="true">
                <input type="hidden" name="bell" id="bell" value="off">
                <input type="hidden" name="view_only" id="view_only" value="{{if .defaultViewOnly}}true{{else}}false{{end}}">
                {{end}}

                <button type="submit" class="btn">Connect</button>
            </form>
        </div>
    </div>
    <script>
        var path = document.getElementById("path");
        var host = document.getElementById("host");
        var port = document.getElementById("port");

        function updatePath() {
            var addr = "vnc";
            if (host && host.value.trim() !== "") {
                addr = addr + "/" + encodeURIComponent(host.value.trim());
                if (port && port.value.toString().trim() !== "") {
                    addr = addr + "/" + port.value.toString().trim();
                }
            }
            path.value = addr;
        }

        if (host) {
            host.addEventListener("input", updatePath);
        }
        if (port) {
            port.addEventListener("input", updatePath);
        }
    </script>
</body>

</html>
